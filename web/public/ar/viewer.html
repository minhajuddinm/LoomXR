<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>See it on the box | LoomXR</title>
<link rel="icon" href="/icon.png" type="image/png">
<!--
  AR viewer. A plain static page on purpose: MindAR ships as ES modules that
  expect an import map, which is simplest outside the Next.js bundler.

  HOW TRACKING WORKS
  The business uploads a straightened photo of each face of the box. MindAR
  recognises those photos in the camera picture ("image targets") and reports
  where each visible face is in 3D.

  HOW THE OVERLAY STAYS ON THE BOX
  There is ONE virtual box, not one per face. Every frame, the best-seen face
  says where the whole box must be (each face knows its own position on the
  box). So when the customer turns the box and the front goes out of view, a
  side or the back takes over and the same box carries on. If no face is
  recognised for a moment (fast movement, fingers in the way), the box holds
  its last position briefly and fades, instead of vanishing at once.

  LIMIT: a face can only take over if the business uploaded its photo.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .bar { position: fixed; left: 0; right: 0; z-index: 10; padding: 12px 14px; display: flex; gap: 8px; align-items: center; }
  #top { top: 0; padding-top: max(12px, env(safe-area-inset-top)); background: linear-gradient(#000b, #0000); }
  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: linear-gradient(#0000, #000d); flex-direction: column; }
  #bottom[hidden], #panel[hidden], [hidden] { display: none !important; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, a.btn { min-height: 46px; min-width: 46px; padding: 0 16px; border-radius: 999px; border: 1px solid #fff9; background: #0009; color: #fff; font: 600 16px system-ui, sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s, transform .1s; -webkit-tap-highlight-color: transparent; }
  button:active, a.btn:active { transform: scale(.96); }
  button[aria-pressed="true"] { background: #fff; color: #12283a; border-color: #fff; }
  button.primary { background: #a9834f; border-color: #a9834f; color: #0b1b29; width: 100%; max-width: 420px; }
  button:disabled { opacity: .5; }
  button:focus-visible, a:focus-visible { outline: 3px solid #f4d58d; outline-offset: 2px; }
  #hint { flex: 1; font-size: 15px; text-align: center; text-shadow: 0 1px 3px #000; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #c8452c; flex: none; transition: background .2s; }
  #dot.on { background: #3fa796; }
  #panel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #12283a; }
  #code { font-size: 40px; font-weight: 700; letter-spacing: .15em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<div id="top" class="bar">
  <a class="btn" id="back" href="/">Back</a>
  <span id="dot" aria-hidden="true"></span>
  <span id="hint" role="status">Starting camera…</span>
  <button type="button" id="switch" hidden aria-label="Switch camera">Lens</button>
</div>

<div id="bottom" class="bar" hidden>
  <div id="switcher" class="row" role="group" aria-label="Designs"></div>
  <button class="primary" id="choose" type="button">Choose this design</button>
</div>

<div id="panel" hidden>
  <p id="panel-text"></p>
  <p id="code" hidden></p>
  <a class="btn" id="panel-back" href="/">Back to designs</a>
</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const params = new URLSearchParams(location.search);
const slug = params.get("slug") ?? "";
const backUrl = `/p/${encodeURIComponent(slug)}`;
const $ = (id) => document.getElementById(id);
$("back").href = backUrl;
$("panel-back").href = backUrl;

function showPanel(text, code) {
  $("panel-text").textContent = text;
  if (code) { $("code").textContent = code; $("code").hidden = false; }
  $("panel").hidden = false;
}

/* ---------- Camera ---------------------------------------------------------
   Browsers default to a low-resolution stream and, on phones with several
   back cameras, sometimes pick the ultra-wide lens, which is soft and has no
   autofocus. MindAR asks for the camera itself, so its request is wrapped
   here to ask for the main back camera in HD with continuous focus. The
   "Lens" button cycles through the back cameras if the first pick is wrong;
   the choice is remembered on this phone. */
const CAMERA_KEY = "loomxr-camera";
let cameraId = localStorage.getItem(CAMERA_KEY) || null;
const realGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = async () => {
  const video = { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } };
  if (cameraId) video.deviceId = { exact: cameraId };
  else video.facingMode = { ideal: "environment" };
  let stream;
  try {
    stream = await realGetUserMedia({ audio: false, video });
  } catch (error) {
    if (!cameraId) throw error;
    // The remembered camera is gone (different phone or browser reset).
    cameraId = null;
    localStorage.removeItem(CAMERA_KEY);
    stream = await realGetUserMedia({ audio: false, video: { ...video, deviceId: undefined, facingMode: { ideal: "environment" } } });
  }
  const track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities?.() ?? {};
    if (caps.focusMode?.includes("continuous")) await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
  } catch { /* focus control is optional */ }
  return stream;
};

async function backCameras() {
  const all = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  const back = all.filter((d) => /back|rear|environment/i.test(d.label));
  return back.length ? back : all;
}

/* ---------- Box geometry ---------------------------------------------------
   For each face: how to turn the box so that face points at the camera (+z),
   how far back (mm) the box centre sits behind that face, and which box
   dimensions are the face's width and height as photographed. */
const FACES = {
  front:  { rot: [0, 0, 0],            back: "depth",  w: "width", h: "height" },
  back:   { rot: [0, Math.PI, 0],      back: "depth",  w: "width", h: "height" },
  right:  { rot: [0, -Math.PI / 2, 0], back: "width",  w: "depth", h: "height" },
  left:   { rot: [0, Math.PI / 2, 0],  back: "width",  w: "depth", h: "height" },
  top:    { rot: [Math.PI / 2, 0, 0],  back: "height", w: "width", h: "depth" },
  bottom: { rot: [-Math.PI / 2, 0, 0], back: "height", w: "width", h: "depth" },
};
// three.js box material order.
const MATERIAL_ORDER = ["right", "left", "top", "bottom", "front", "back"];

// The box's transform relative to a tracked face. MindAR's unit is "one
// target-image width", with the image centred at the origin facing +z.
// `imageAspect` is the photo's height / width. If the photo was taken turned
// a quarter turn relative to the face, that is detected and corrected.
function faceOffset(face, dims, imageAspect) {
  const f = FACES[face];
  const faceW = dims[f.w], faceH = dims[f.h];
  const upright = Math.abs(imageAspect - faceH / faceW) <= Math.abs(imageAspect - faceW / faceH);
  const scale = 1 / (upright ? faceW : faceH);

  const m = new THREE.Matrix4();
  if (!upright) m.multiply(new THREE.Matrix4().makeRotationZ(Math.PI / 2));
  m.multiply(new THREE.Matrix4().makeScale(scale, scale, scale));
  m.multiply(new THREE.Matrix4().makeTranslation(0, 0, -dims[f.back] / 2));
  m.multiply(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...f.rot)));
  return m;
}

const HOLD_MS = 2500;   // keep the box this long after every face is lost
const FADE_MS = 900;    // fade out over the last part of the hold
const FOLLOW = 0.45;    // 0..1, how quickly the box follows the tracked pose
const STICKY = 0.12;    // a new face must be this much better to take over

let mindar;
try {
  const response = await fetch(`/api/session/ar?slug=${encodeURIComponent(slug)}`);
  if (!response.ok) throw new Error("session");
  const data = await response.json();
  const dims = data.product;
  if (!data.designs.length || !data.faces.length) throw new Error("session");

  mindar = new MindARThree({
    container: $("stage"),
    imageTargetSrc: data.targetsUrl,
    // Two faces at once, so a neighbouring face is already tracked when the
    // current one turns away.
    maxTrack: Math.min(2, data.faces.length),
    uiLoading: "no", uiScanning: "no", uiError: "no",
    filterMinCF: 0.001, filterBeta: 100,
    warmupTolerance: 2, missTolerance: 10,
  });
  const { renderer, scene, camera } = mindar;

  /* ---- The one virtual box ---- */
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin("anonymous");
  const materials = MATERIAL_ORDER.map(() => new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
  const box = new THREE.Mesh(new THREE.BoxGeometry(dims.width, dims.height, dims.depth), materials);
  box.matrixAutoUpdate = false;
  box.visible = false;
  scene.add(box);

  function showDesign(design) {
    MATERIAL_ORDER.forEach((face, i) => {
      loader.load(design.textures[face], (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        materials[i].map?.dispose();
        materials[i].map = texture;
        materials[i].needsUpdate = true;
      });
    });
  }

  /* ---- One anchor per photographed face ---- */
  const anchors = data.faces.map(({ face, target_index }) => {
    const anchor = mindar.addAnchor(target_index);
    const entry = { face, index: target_index, group: anchor.group, seen: false, offset: null };
    anchor.onTargetFound = () => { entry.seen = true; };
    anchor.onTargetLost = () => { entry.seen = false; };
    return entry;
  });

  /* ---- Design switcher ---- */
  let current = Math.max(0, data.designs.findIndex((d) => d.id === params.get("design")));
  const buttons = data.designs.map((design, i) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = String(i + 1);
    button.setAttribute("aria-label", `Design ${i + 1}`);
    button.addEventListener("click", () => select(i));
    $("switcher").append(button);
    return button;
  });
  function select(i) {
    current = i;
    buttons.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    showDesign(data.designs[i]);
  }
  select(current);

  $("choose").addEventListener("click", async () => {
    $("choose").disabled = true;
    const res = await fetch(`/api/designs/${data.designs[current].id}/select`, { method: "POST" });
    const json = await res.json().catch(() => ({}));
    if (res.ok) {
      mindar.stop();
      showPanel("Design saved. Show this code at the till.", json.orderCode);
      $("panel-back").hidden = true;
    } else {
      $("choose").disabled = false;
      $("hint").textContent = json.error ?? "Could not save. Try again.";
    }
  });

  await mindar.start();

  // The compiled tracking file knows each photo's real size; use it so the
  // overlay matches the photo even if it was taken turned on its side.
  const sizes = mindar.controller?.dimensions ?? [];
  for (const a of anchors) {
    const [w, h] = sizes[a.index] ?? [1, dims[FACES[a.face].h] / dims[FACES[a.face].w]];
    a.offset = faceOffset(a.face, dims, h / w);
  }

  /* ---- Lens switch ---- */
  const cameras = await backCameras();
  if (cameras.length > 1) {
    $("switch").hidden = false;
    $("switch").addEventListener("click", async () => {
      const active = mindar.video?.srcObject?.getVideoTracks?.()[0]?.getSettings?.().deviceId;
      const at = cameras.findIndex((c) => c.deviceId === (cameraId ?? active));
      cameraId = cameras[(at + 1) % cameras.length].deviceId;
      localStorage.setItem(CAMERA_KEY, cameraId);
      location.reload();
    });
  }

  /* ---- Per-frame: place the one box from the best-seen face ---- */
  const target = new THREE.Matrix4();
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
  const tPos = new THREE.Vector3(), tQuat = new THREE.Quaternion(), tScl = new THREE.Vector3();
  const normal = new THREE.Vector3();
  let lead = null, lastSeen = 0, placed = false;

  // How squarely a face looks at the camera: 1 = straight on, 0 = edge on.
  const facing = (a) => Math.max(0, normal.setFromMatrixColumn(a.group.matrix, 2).normalize().z);

  function frame(now) {
    const visible = anchors.filter((a) => a.seen && a.group.visible);
    if (visible.length) {
      let best = visible.includes(lead) ? lead : null;
      let bestScore = best ? facing(best) + STICKY : -1;
      for (const a of visible) {
        const score = facing(a);
        if (score > bestScore) { best = a; bestScore = score; }
      }
      lead = best;
      target.multiplyMatrices(lead.group.matrix, lead.offset).decompose(tPos, tQuat, tScl);
      if (!placed) {
        pos.copy(tPos); quat.copy(tQuat); scl.copy(tScl);
        placed = true;
      } else {
        pos.lerp(tPos, FOLLOW); quat.slerp(tQuat, FOLLOW); scl.lerp(tScl, FOLLOW);
      }
      box.matrix.compose(pos, quat, scl);
      box.visible = true;
      for (const m of materials) m.opacity = 1;
      lastSeen = now;
      $("dot").className = "on";
      $("hint").textContent = "Turn the box to look around";
    } else if (placed) {
      const lost = now - lastSeen;
      if (lost > HOLD_MS) {
        box.visible = false;
        placed = false;
        lead = null;
        $("hint").textContent = "Point the camera at the box";
      } else {
        const fade = Math.min(1, Math.max(0, (HOLD_MS - lost) / FADE_MS));
        for (const m of materials) m.opacity = fade;
        $("hint").textContent = "Hold the box a little steadier";
      }
      $("dot").className = "";
    }
    renderer.render(scene, camera);
  }

  $("bottom").hidden = false;
  $("hint").textContent = "Point the camera at the box";
  renderer.setAnimationLoop(() => frame(performance.now()));
} catch (error) {
  console.error(error);
  try { mindar?.stop(); } catch { /* already stopped */ }
  // MindAR rejects with no error object when the camera cannot be opened.
  const denied = !error || error?.name === "NotAllowedError" || error?.name === "NotFoundError";
  showPanel(
    denied
      ? "The camera could not be opened. Allow camera access for this site in your browser settings, then try again."
      : error?.message === "session"
        ? "Your designs were not found. Go back and create them first."
        : "The camera preview could not start on this device.",
  );
}
</script>
</body>
</html>
