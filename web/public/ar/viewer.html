<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>See it on the box | LoomXR</title>
<!--
  AR viewer. A plain static page on purpose: MindAR ships as ES modules that
  expect an import map, which is simplest outside the Next.js bundler.

  How it works: MindAR recognises the photos the business uploaded (one per
  box face). Whichever face it sees becomes an "anchor". A 3D box of the real
  dimensions is attached to that anchor, shifted back so its matching face
  sits exactly on the real one, and textured with the chosen design.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .bar { position: fixed; left: 0; right: 0; z-index: 10; padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  #top { top: 0; padding-top: max(12px, env(safe-area-inset-top)); background: linear-gradient(#000a, #0000); }
  #bottom { bottom: 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: linear-gradient(#0000, #000c); flex-wrap: wrap; justify-content: center; }
  button, a.btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #fff; background: #0008; color: #fff; font: 600 16px system-ui, sans-serif; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed="true"] { background: #fff; color: #12283a; }
  button.primary { background: #1f6e7d; border-color: #1f6e7d; }
  button:focus-visible, a:focus-visible { outline: 3px solid #f4d58d; outline-offset: 2px; }
  #hint { flex: 1; font-size: 15px; text-align: right; }
  #panel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #12283a; }
  #panel[hidden] { display: none; }
  #code { font-size: 40px; font-weight: 700; letter-spacing: .15em; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<div id="top" class="bar">
  <a class="btn" id="back" href="/">Back</a>
  <span id="hint" role="status">Starting camera…</span>
</div>

<div id="bottom" class="bar" hidden>
  <div id="switcher" role="group" aria-label="Designs" style="display:flex;gap:8px"></div>
  <button class="primary" id="choose" type="button">Choose this design</button>
</div>

<div id="panel" hidden>
  <p id="panel-text"></p>
  <p id="code" hidden></p>
  <a class="btn" id="panel-back" href="/">Back to designs</a>
</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const params = new URLSearchParams(location.search);
const slug = params.get("slug") ?? "";
const backUrl = `/p/${encodeURIComponent(slug)}`;
const $ = (id) => document.getElementById(id);
$("back").href = backUrl;
$("panel-back").href = backUrl;

function showPanel(text, code) {
  $("panel-text").textContent = text;
  if (code) { $("code").textContent = code; $("code").hidden = false; }
  $("panel").hidden = false;
}

// How to turn the box so the named face points at the camera (+z), and how
// far to push it back (in mm) so that face lands on the tracked image.
const FACE_POSE = {
  front:  (d) => ({ rot: [0, 0, 0],             back: d.depth / 2 }),
  back:   (d) => ({ rot: [0, Math.PI, 0],       back: d.depth / 2 }),
  right:  (d) => ({ rot: [0, -Math.PI / 2, 0],  back: d.width / 2 }),
  left:   (d) => ({ rot: [0, Math.PI / 2, 0],   back: d.width / 2 }),
  top:    (d) => ({ rot: [Math.PI / 2, 0, 0],   back: d.height / 2 }),
  bottom: (d) => ({ rot: [-Math.PI / 2, 0, 0],  back: d.height / 2 }),
};
// Width in mm of each face as photographed. MindAR's unit is "one image width".
const FACE_WIDTH = { front: "width", back: "width", top: "width", bottom: "width", left: "depth", right: "depth" };
// three.js box material order.
const MATERIAL_ORDER = ["right", "left", "top", "bottom", "front", "back"];

try {
  const response = await fetch(`/api/session/ar?slug=${encodeURIComponent(slug)}`);
  if (!response.ok) throw new Error("session");
  const data = await response.json();
  const dims = data.product;
  if (!data.designs.length || !data.faces.length) throw new Error("session");

  const mindar = new MindARThree({
    container: $("stage"),
    imageTargetSrc: data.targetsUrl,
    maxTrack: 1,
    uiLoading: "no", uiScanning: "no", uiError: "no",
    // Smoothing: lower values are steadier but lag more.
    filterMinCF: 0.0005, filterBeta: 0.01,
    warmupTolerance: 3, missTolerance: 8,
  });
  const { renderer, scene, camera } = mindar;
  scene.add(new THREE.AmbientLight(0xffffff, 1));

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin("anonymous");
  const materials = MATERIAL_ORDER.map(() => new THREE.MeshBasicMaterial({ color: 0xffffff }));

  function showDesign(design) {
    MATERIAL_ORDER.forEach((face, i) => {
      loader.load(design.textures[face], (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        materials[i].map?.dispose();
        materials[i].map = texture;
        materials[i].needsUpdate = true;
      });
    });
  }

  const geometry = new THREE.BoxGeometry(dims.width, dims.height, dims.depth);
  let visible = 0;
  for (const { face, target_index } of data.faces) {
    const pose = FACE_POSE[face](dims);
    const scale = 1 / dims[FACE_WIDTH[face]];
    const mesh = new THREE.Mesh(geometry, materials);
    mesh.rotation.set(...pose.rot);
    const holder = new THREE.Group();
    holder.add(mesh);
    holder.scale.setScalar(scale);
    holder.position.z = -pose.back * scale;
    const anchor = mindar.addAnchor(target_index);
    anchor.group.add(holder);
    anchor.onTargetFound = () => { visible++; $("hint").textContent = "Turn the box to look around"; };
    anchor.onTargetLost = () => { visible = Math.max(0, visible - 1); if (!visible) $("hint").textContent = "Point the camera at the front of the box"; };
  }

  let current = Math.max(0, data.designs.findIndex((d) => d.id === params.get("design")));
  const buttons = data.designs.map((design, i) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = String(i + 1);
    button.setAttribute("aria-label", `Design ${i + 1}`);
    button.addEventListener("click", () => select(i));
    $("switcher").append(button);
    return button;
  });
  function select(i) {
    current = i;
    buttons.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    showDesign(data.designs[i]);
  }
  select(current);

  $("choose").addEventListener("click", async () => {
    $("choose").disabled = true;
    const res = await fetch(`/api/designs/${data.designs[current].id}/select`, { method: "POST" });
    const json = await res.json().catch(() => ({}));
    if (res.ok) {
      mindar.stop();
      showPanel("Design saved. Show this code at the till.", json.orderCode);
      $("panel-back").hidden = true;
    } else {
      $("choose").disabled = false;
      $("hint").textContent = json.error ?? "Could not save. Try again.";
    }
  });

  await mindar.start();
  $("bottom").hidden = false;
  $("hint").textContent = "Point the camera at the front of the box";
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
} catch (error) {
  console.error(error);
  // MindAR rejects with no error object when the camera cannot be opened.
  const denied = !error || error?.name === "NotAllowedError";
  showPanel(
    denied
      ? "The camera could not be opened. Allow camera access for this site in your browser settings, then try again."
      : error?.message === "session"
        ? "Your designs were not found. Go back and create them first."
        : "The camera preview could not start on this device.",
  );
}
</script>
</body>
</html>
